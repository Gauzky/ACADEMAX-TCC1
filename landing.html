<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcadeMax — Seu treino em outro nível</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --bg-card: #111114;
            --accent: #6366f1; 
            --text-1: #f4f4f5;
            --text-2: #a1a1aa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text-1);
            overflow-x: hidden;
        }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; position: absolute; width: 100%; top: 0; z-index: 10;
        }
        
        .logo { display: flex; align-items: center; gap: 9px; }
        .logo svg { width: 28px; height: 28px; }
        .logo-text { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
        .logo-ade { color: var(--text-1); }
        .logo-max { color: var(--accent); }
        
        .btn-entrar {
            background: transparent; border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-1); padding: 10px 24px; border-radius: 8px;
            text-decoration: none; font-weight: 600; transition: 0.2s;
        }
        .btn-entrar:hover { background: rgba(255,255,255,0.1); }

        .hero {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 20px;
            background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15) 0%, var(--bg) 60%);
        }
        .hero-content { max-width: 800px; z-index: 2; }
        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 64px; font-weight: 700; line-height: 1.1; margin-bottom: 24px;
            text-transform: uppercase;
        }
        h1 span { color: var(--accent); }
        p.subtitle { font-size: 20px; color: var(--text-2); margin-bottom: 40px; line-height: 1.5; }
        
        .cta-group { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .btn-primary {
            background: var(--accent); color: #fff; padding: 16px 32px;
            border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 18px;
            display: flex; align-items: center; gap: 10px; transition: 0.2s;
            border: none; cursor: pointer;
        }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-2px); }
        
        .btn-secondary {
            background: rgba(255,255,255,0.05); color: var(--text-1); padding: 16px 32px;
            border-radius: 12px; text-decoration: none; font-weight: 700; font-size: 18px;
            display: flex; align-items: center; gap: 10px; transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }

        /* ========================================== */
        /* ESTILO DO TOAST (Notificação Customizada)  */
        /* ========================================== */
        #academax-toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #18181b; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 16px 24px;
            display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 999;
            max-width: 90vw; width: max-content;
            opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
            font-size: 14px; color: var(--text-1); line-height: 1.5;
        }
        #academax-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
        #academax-toast p { margin: 0; }
        #academax-toast i { color: var(--accent); margin-right: 6px; }

        @media (max-width: 768px) {
            h1 { font-size: 40px; }
            p.subtitle { font-size: 16px; }
            .cta-group { flex-direction: column; }
            header { padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20.57 12C20.57 16.78 16.72 20.64 11.73 20.64C6.74 20.64 2.88 16.78 2.88 12" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M2.88 12C2.88 7.22 6.74 3.16 11.73 3.16C16.72 3.16 20.57 7.22 20.57 12" stroke="var(--text-1)" stroke-width="2.5" stroke-linecap="round"/>
                <rect x="9.5" y="2" width="4" height="20" rx="2" fill="var(--accent)"/>
            </svg>
            <div class="logo-text"><span class="logo-ade">ACADE</span><span class="logo-max">MAX</span></div>
        </div>
        
        <a href="/login" class="btn-entrar">Entrar</a>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>O SEU TREINO<br>EM OUTRO <span>NÍVEL</span></h1>
            <p class="subtitle">Acompanhe sua evolução, gerencie seus treinos e alcance seus objetivos com a plataforma definitiva para atletas e personal trainers.</p>
            
            <div class="cta-group">
                <button id="install-btn" class="btn-primary">
                    <i class="fa-solid fa-download"></i> Baixar para o Celular
                </button>
                
                <a href="/app" class="btn-secondary">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Abrir o AcadeMax
                </a>
            </div>
        </div>
    </section>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        // Função para mostrar o Toast elegante
        function showToast(messageHTML) {
            let toast = document.getElementById('academax-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'academax-toast';
                document.body.appendChild(toast);
            }
            toast.innerHTML = messageHTML;
            toast.classList.add('show');
            
            // Esconde o toast após 7 segundos
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 7000);
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                // Se o navegador suportar instalação automática
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.innerHTML = '<i class="fa-solid fa-check"></i> Instalado!';
                }
                deferredPrompt = null;
            } else {
                // Se o navegador não suportar, mostra o tutorial no Toast
                showToast(`
                    <p style="font-weight:700; color:var(--accent);"><i class="fa-solid fa-mobile-screen"></i> Como instalar o AcadeMax</p>
                    <p>📱 <strong>Android:</strong> Menu (3 pontinhos) > "Instalar aplicativo".</p>
                    <p>📱 <strong>iPhone:</strong> Compartilhar > "Adicionar à Tela de Início".</p>
                    <p>💻 <strong>PC:</strong> Clique no ícone de instalação na barra de endereços.</p>
                `);
            }
        });
    </script>
</body>
</html>
